<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Header Gradient -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Checkmark Gradient -->
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Clip path for calendar top header -->
    <clipPath id="calClip">
      <rect x="92" y="102" width="328" height="308" rx="52"/>
    </clipPath>
  </defs>

  <!-- Outer Squircle Badge -->
  <rect x="20" y="20" width="472" height="472" rx="124" fill="url(#bgGrad)"/>

  <!-- Calendar Base (White) -->
  <rect x="92" y="102" width="328" height="308" rx="52" fill="#ffffff"/>

  <!-- Calendar Top Header Strip -->
  <g clip-path="url(#calClip)">
    <rect x="92" y="102" width="328" height="92" fill="url(#headerGrad)"/>
  </g>

  <!-- Binder Rings at Top -->
  <rect x="164" y="66" width="34" height="62" rx="17" fill="#ffffff" stroke="#0284c7" stroke-width="8"/>
  <rect x="314" y="66" width="34" height="62" rx="17" fill="#ffffff" stroke="#0284c7" stroke-width="8"/>

  <!-- Calendar Grid Dots / Accents (subtle) -->
  <circle cx="156" cy="242" r="14" fill="#e0f2fe"/>
  <circle cx="216" cy="242" r="14" fill="#e0f2fe"/>
  <circle cx="156" cy="302" r="14" fill="#e0f2fe"/>
  <circle cx="156" cy="362" r="14" fill="#e0f2fe"/>

  <!-- Bold Emerald Checkmark -->
  <path d="M 212,306 L 276,368 L 386,228" 
        fill="none" 
        stroke="url(#checkGrad)" 
        stroke-width="44" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
</svg>
